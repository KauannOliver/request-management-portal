version: '3.8'

services:
  # Container PHP-FPM (Aplicação Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao_sau_sd_app
    restart: unless-stopped
    volumes:
      # Mapeia os arquivos da aplicação
      - .:/var/www/html
      # Mapeia a pasta do SQLite de forma persistente
      - ./data:/var/www/html/data
    environment:
      - TZ=America/Sao_Paulo
      # Força o Laravel a ler o banco de dados mapeado fora da pasta temporária
      - DB_DATABASE=/var/www/html/data/database.sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"] # FPM não responde http direto, mas curl http://localhost:8080/healthcheck no web container é melhor. Ou podemos fazer healthcheck no container web.
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Container Nginx (Servidor Web)
  web:
    image: nginx:alpine
    container_name: gestao_sau_sd_web
    restart: unless-stopped
    ports:
      - "8039:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
